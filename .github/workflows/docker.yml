name: Publish Docker images

# Triggers:
#   - push to main:   rebuild and publish :latest (for Dockerfile / workflow changes here)
#   - schedule:       nightly refresh of :latest / :main (base-image security fixes)
#                     and a fresh :dev build of -cli images from chapkit's main branch.
#   - workflow_dispatch: manual trigger with a specific chapkit version
#                        from PyPI (e.g. 2.4.1). Defaults to the pinned
#                        release below. Only affects -cli images. Also
#                        triggers a :dev rebuild.
#   - repository_dispatch (event=chapkit-release): a chapkit release fires
#     this to rebuild the -cli images against the released version.
#
# Tag scheme:
#   - :latest / :main / :sha-* / :<semver>  -- chapkit installed from PyPI
#                                              (release version pinned in env below)
#   - :dev                                  -- chapkit installed from the main branch
#                                              of github.com/dhis2-chap/chapkit
#                                              (only on -cli images; base images
#                                              don't have chapkit so :dev is N/A)
on:
  push:
    branches: [main]
    tags: ['v*']
    # A change to only docs cannot change an image, and a full build takes
    # hours. The nightly schedule still refreshes every image.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths:
      - 'chapkit-py.Dockerfile'
      - 'chapkit-py-data.Dockerfile'
      - 'chapkit-r.Dockerfile'
      - 'chapkit-r-tidyverse.Dockerfile'
      - 'chapkit-r-inla.Dockerfile'
      - '.github/workflows/docker.yml'
      - '.github/workflows/build-image.yml'
  schedule:
    - cron: '17 4 * * *'  # nightly at 04:17 UTC — refreshes :latest / :main
                          # and stamps :dev so consumers can pin to nightly.
  workflow_dispatch:
    inputs:
      chapkit_version:
        description: 'chapkit PyPI version to install in -cli images (e.g. 2.4.1)'
        required: false
        default: ''
  repository_dispatch:
    types: [chapkit-release]

permissions:
  contents: read
  packages: write

env:
  # Resolve the chapkit version for this run. workflow_dispatch input
  # wins, otherwise repository_dispatch client_payload.ref (which may
  # come in as 'v2.4.1' or '2.4.1' — the Dockerfile strips a leading
  # 'v'), otherwise the currently-pinned release. Only consumed by the
  # -cli build steps; base images do not install chapkit.
  CHAPKIT_VERSION: >-
    ${{ github.event.inputs.chapkit_version
        || github.event.client_payload.ref
        || '2.4.1' }}

jobs:
  # Resolve a tag downstream phases can FROM. We use the short SHA
  # (sha-<7-char>) so the reference is unique per commit and works for
  # both PR and main builds. metadata-action emits this tag for every
  # event type. Also passes CHAPKIT_VERSION on, since the env context is
  # not available to the reusable workflow calls below.
  resolve-from-tag:
    name: resolve-from-tag
    runs-on: ubuntu-latest
    outputs:
      from_tag: ${{ steps.tag.outputs.from_tag }}
      chapkit_version: ${{ steps.tag.outputs.chapkit_version }}
    steps:
      - id: tag
        run: |
          echo "from_tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "chapkit_version=${{ env.CHAPKIT_VERSION }}" >> "$GITHUB_OUTPUT"

  # Every image builds through build-image.yml: one job per architecture on a
  # native runner (arm64 on ubuntu-24.04-arm, no QEMU), then a merge job that
  # tags the multi-arch manifest. Each also builds its -cli image on top.

  # Phase 1: leaf images with no FROM dependency on other chapkit-images entries.
  build-py:
    name: chapkit-py
    needs: [resolve-from-tag]
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: chapkit-py.Dockerfile
      image: chapkit-py
      chapkit_version: ${{ needs.resolve-from-tag.outputs.chapkit_version }}

  build-r:
    name: chapkit-r
    needs: [resolve-from-tag]
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: chapkit-r.Dockerfile
      image: chapkit-r
      chapkit_version: ${{ needs.resolve-from-tag.outputs.chapkit_version }}

  # Phase 2: each FROM its leaf's sha-* tag, so each waits only for its own leaf.
  build-py-data:
    name: chapkit-py-data
    needs: [resolve-from-tag, build-py]
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: chapkit-py-data.Dockerfile
      image: chapkit-py-data
      build_args: CHAPKIT_PY_IMAGE=ghcr.io/dhis2-chap/chapkit-py:${{ needs.resolve-from-tag.outputs.from_tag }}
      chapkit_version: ${{ needs.resolve-from-tag.outputs.chapkit_version }}

  build-r-tidyverse:
    name: chapkit-r-tidyverse
    needs: [resolve-from-tag, build-r]
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: chapkit-r-tidyverse.Dockerfile
      image: chapkit-r-tidyverse
      build_args: CHAPKIT_R_IMAGE=ghcr.io/dhis2-chap/chapkit-r:${{ needs.resolve-from-tag.outputs.from_tag }}
      chapkit_version: ${{ needs.resolve-from-tag.outputs.chapkit_version }}

  # Phase 3: chapkit-r-inla FROM chapkit-r-tidyverse:sha-*. amd64 only: INLA
  # publishes x86_64 Linux binaries only.
  build-r-inla:
    name: chapkit-r-inla
    needs: [resolve-from-tag, build-r-tidyverse]
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: chapkit-r-inla.Dockerfile
      image: chapkit-r-inla
      multi_arch: false
      build_args: CHAPKIT_R_TIDYVERSE_IMAGE=ghcr.io/dhis2-chap/chapkit-r-tidyverse:${{ needs.resolve-from-tag.outputs.from_tag }}
      chapkit_version: ${{ needs.resolve-from-tag.outputs.chapkit_version }}

  # Aggregator job so existing `needs: [build]` references still work.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [build-py, build-r, build-py-data, build-r-tidyverse, build-r-inla]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.build-py.result }}" != "success" ] || \
             [ "${{ needs.build-r.result }}" != "success" ] || \
             [ "${{ needs.build-py-data.result }}" != "success" ] || \
             [ "${{ needs.build-r-tidyverse.result }}" != "success" ] || \
             [ "${{ needs.build-r-inla.result }}" != "success" ]; then
            echo "One or more build phases failed"
            exit 1
          fi

  build-dev:
    # Nightly :dev build of -cli images against chapkit's main branch.
    # Only runs on schedule and workflow_dispatch. Base images are not
    # rebuilt here -- they don't carry chapkit, so :dev would be a
    # duplicate of :latest. Derived -cli:dev builds therefore FROM the
    # :latest base refreshed by the build phases earlier in this run,
    # hence needs: [build].
    #
    # CHAPKIT_GIT_REF=main means uv installs from a literal `@main` ref.
    # BuildKit's layer cache is keyed on the RUN command text, so the
    # bundled-stage cache may serve a stale chapkit until something
    # earlier in the build invalidates the layer. In practice, nightly
    # base-image layer churn handles this often enough.
    name: ${{ matrix.image }}-cli:dev
    needs: [build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: chapkit-py.Dockerfile
            image: chapkit-py
            multi_arch: true
            build_args: ""
          - dockerfile: chapkit-py-data.Dockerfile
            image: chapkit-py-data
            multi_arch: true
            build_args: "CHAPKIT_PY_IMAGE=ghcr.io/dhis2-chap/chapkit-py:latest"
          - dockerfile: chapkit-r.Dockerfile
            image: chapkit-r
            multi_arch: true
            build_args: ""
          - dockerfile: chapkit-r-tidyverse.Dockerfile
            image: chapkit-r-tidyverse
            multi_arch: true
            build_args: "CHAPKIT_R_IMAGE=ghcr.io/dhis2-chap/chapkit-r:latest"
          - dockerfile: chapkit-r-inla.Dockerfile
            image: chapkit-r-inla
            multi_arch: false
            build_args: "CHAPKIT_R_TIDYVERSE_IMAGE=ghcr.io/dhis2-chap/chapkit-r-tidyverse:latest"
    uses: ./.github/workflows/build-image.yml
    with:
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      multi_arch: ${{ matrix.multi_arch }}
      build_args: ${{ matrix.build_args }}
      dev: true

  smoke:
    name: smoke
    needs: [build]
    # Only run after images are actually pushed (not on PR builds where
    # push is skipped). Limits to refs/heads/main so we pull :main — tag
    # builds use a different tag scheme and can gain their own smoke job
    # once the semver tagging is fixed up.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Base images: chapkit is intentionally absent. Verify uv is on
      # PATH so downstream `uv sync` works.
      - name: Smoke chapkit-py
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py:main uv --version

      - name: Smoke chapkit-py-data (the stack imports)
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py-data:main python -c "import numpy, pandas, scipy, sklearn, statsmodels.api, joblib, yaml, xarray; print('OK')"

      - name: Smoke chapkit-r
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r:main uv --version

      - name: Smoke chapkit-r-tidyverse
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-tidyverse:main uv --version

      - name: Smoke chapkit-r-tidyverse (tidyverse loads as chapkit user)
        run: docker run --rm --user chapkit -e HOME=/tmp ghcr.io/dhis2-chap/chapkit-r-tidyverse:main R -q -e "library(tidyverse); library(fable); library(tsibble); cat('OK\n')"

      - name: Smoke chapkit-r-inla
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-inla:main uv --version

      - name: Smoke chapkit user (uid/gid 1000)
        run: |
          for image in chapkit-py chapkit-py-data chapkit-r chapkit-r-inla; do
            docker run --rm --user chapkit "ghcr.io/dhis2-chap/${image}:main" sh -c 'test "$(id -u)" = 1000 && test "$(id -g)" = 1000 && uv --version'
          done

      # INLA must actually run as the unprivileged user, not only load.
      - name: Smoke chapkit-r-inla (INLA fits as chapkit user)
        run: docker run --rm --user chapkit -e HOME=/tmp ghcr.io/dhis2-chap/chapkit-r-inla:main R -q -e "library(INLA); r <- inla(y ~ 1, data = data.frame(y = rnorm(20))); stopifnot(!is.null(r\$summary.fixed)); cat('INLA OK\n')"

      # -cli images: chapkit is pre-installed, so `chapkit --help` works.
      - name: Smoke chapkit-py-cli
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py-cli:main chapkit --help

      - name: Smoke chapkit-py-data-cli
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py-data-cli:main chapkit --help

      - name: Smoke chapkit-r-cli
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-cli:main chapkit --help

      - name: Smoke chapkit-r-tidyverse-cli
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-tidyverse-cli:main chapkit --help

      - name: Smoke chapkit-r-inla-cli (CLI)
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-inla-cli:main chapkit --help

      - name: Smoke chapkit-r-inla-cli (INLA loads)
        run: |
          docker run --rm ghcr.io/dhis2-chap/chapkit-r-inla-cli:main \
            R -q -e "library(INLA); cat('INLA', as.character(packageVersion('INLA')), '\n')"

  # The multi-arch images on arm64, which smoke (an amd64 runner) never pulls.
  # chapkit-r-inla is amd64 only. A separate job rather than a matrix on smoke,
  # so the required "smoke" check keeps its name.
  smoke-arm64:
    name: smoke-arm64
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke base images (uv on PATH, chapkit user)
        run: |
          for image in chapkit-py chapkit-py-data chapkit-r chapkit-r-tidyverse; do
            docker run --rm --user chapkit "ghcr.io/dhis2-chap/${image}:main" sh -c 'test "$(id -u)" = 1000 && uv --version'
          done

      - name: Smoke chapkit-py-data (the stack imports)
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py-data:main python -c "import numpy, pandas, scipy, sklearn, statsmodels.api, joblib, yaml, xarray; print('OK')"

      - name: Smoke chapkit-r-tidyverse (tidyverse loads as chapkit user)
        run: docker run --rm --user chapkit -e HOME=/tmp ghcr.io/dhis2-chap/chapkit-r-tidyverse:main R -q -e "library(tidyverse); library(fable); library(tsibble); cat('OK\n')"

      - name: Smoke -cli images
        run: |
          for image in chapkit-py-cli chapkit-py-data-cli chapkit-r-cli chapkit-r-tidyverse-cli; do
            docker run --rm "ghcr.io/dhis2-chap/${image}:main" chapkit --help > /dev/null
          done

  smoke-dev:
    name: smoke-dev
    needs: [build-dev]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke chapkit-py-cli :dev
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py-cli:dev chapkit --help

      - name: Smoke chapkit-py-data-cli :dev
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-py-data-cli:dev chapkit --help

      - name: Smoke chapkit-r-cli :dev
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-cli:dev chapkit --help

      - name: Smoke chapkit-r-tidyverse-cli :dev
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-tidyverse-cli:dev chapkit --help

      - name: Smoke chapkit-r-inla-cli :dev (CLI)
        run: docker run --rm ghcr.io/dhis2-chap/chapkit-r-inla-cli:dev chapkit --help

      - name: Smoke chapkit-r-inla-cli :dev (INLA loads)
        run: |
          docker run --rm ghcr.io/dhis2-chap/chapkit-r-inla-cli:dev \
            R -q -e "library(INLA); cat('INLA', as.character(packageVersion('INLA')), '\n')"
